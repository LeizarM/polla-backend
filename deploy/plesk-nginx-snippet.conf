# ════════════════════════════════════════════════════════════════════════
#  Pega esto en Plesk → apuestamundial.impexpap.com →
#         Configuración de Apache y Nginx → Directivas adicionales de Nginx
#
#  Habilita:
#   - HTTPS forzado (cuando ya tengas el cert Let's Encrypt de Plesk activo)
#   - Headers correctos para el Service Worker (sin caché del SW mismo)
#   - SPA fallback: cualquier ruta desconocida → index.html (para que /user/polla
#     funcione si el usuario abre el link directo)
#   - Caché largo para assets con hash (los *.js y *.css de Expo)
#   - Headers de seguridad básicos
# ════════════════════════════════════════════════════════════════════════

# ── Headers globales ────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# ── Service Worker: NUNCA debe quedar cacheado en CDN/browser ──────
# Si se cachea, el user puede quedar con una versión vieja del SW para siempre.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
}

# ── Manifest tampoco se cachea mucho ───────────────────────────────
location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate";
    expires 1h;
}

# ── Assets con hash en el nombre → cache 1 año ─────────────────────
location ~* ^/_expo/static/.+\.(js|css|woff2?|png|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
}

# ── SPA fallback: rutas client-side (Expo Router) ──────────────────
# Si el navegador pide /user/polla y el archivo no existe, servimos index.html.
location / {
    try_files $uri $uri/ /index.html;
}
