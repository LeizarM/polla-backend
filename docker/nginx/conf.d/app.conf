# ════════════════════════════════════════════════════════════════════════
#  Backend Mundial 2026 — público en https://app.esppapel.com:9443
#  El frontend vive en OTRO servidor → este Nginx solo proxea /api a NestJS.
# ════════════════════════════════════════════════════════════════════════

# ── HTTP (9080) — ACME challenge + redirect a HTTPS ─────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.esppapel.com;

    # Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Cualquier otra cosa → fuerza HTTPS (con puerto custom)
    location / {
        return 301 https://$host:9443$request_uri;
    }
}

# ── HTTPS (9443) — el backend ──────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    listen [::]:443 ssl default_server;
    server_name app.esppapel.com;

    # ── TLS (Let's Encrypt) ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/app.esppapel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.esppapel.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.esppapel.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers (este Nginx solo sirve API JSON) ──────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # ── Anti-DDoS: límites por IP ──────────────────────────────────────
    limit_conn conn_per_ip 30;

    # ── /api/auth/login + /api/signup — brute-force strict ─────────────
    location ~ ^/api/(auth/login|signup)$ {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── /api/* — toda la API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api   burst=20 nodelay;
        limit_req zone=burst burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Health check público (sin rate limit) ──────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://backend:3000/health;
        proxy_read_timeout 5s;
    }

    # ── Frontend web (Expo export) servido desde el mismo dominio/puerto ──
    # Los archivos estáticos viven en /usr/share/nginx/html (montado desde
    # /opt/mundial2026/frontend-dist). SPA fallback a index.html para que el
    # routing de Expo Router funcione en recargas / deep-links.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache largo para assets con hash (JS/CSS/img). index.html sin cache
        # para que siempre tome la última versión tras un redeploy.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # ── Bloquear paths probe ───────────────────────────────────────────
    location ~ /\.(env|git|ht) { deny all; return 404; }
    location ~ /(wp-admin|wp-login|phpmyadmin|admin\.php|\.well-known/security\.txt) { deny all; return 404; }
}
