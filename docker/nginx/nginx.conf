user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Hide version banner (don't tell attackers what we run) ────────
    server_tokens off;

    # ─── Log format (real client IP from $http_x_real_ip, set by fail2ban filter) ─
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ─── Connection limits per client IP (anti-DDoS soft) ─────────────
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ─── Request rate limit zones ─────────────────────────────────────
    #  - "api":   60 req/min general (sustained)
    #  - "auth":  10 req/min for /api/auth/login and /api/signup (brute force)
    #  - "burst": 5 req/sec spike control
    limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=burst:10m rate=5r/s;

    # ─── Buffer / timeout tuning (mitigate Slowloris) ─────────────────
    client_body_timeout      10s;
    client_header_timeout    10s;
    keepalive_timeout        30s;
    send_timeout             10s;
    client_max_body_size     5m;
    large_client_header_buffers 4 8k;

    # ─── gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml application/wasm;

    # ─── Real IP from upstream (Docker bridge / fail2ban needs this) ──
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
