# ════════════════════════════════════════════════════════════════════════
#  CI/CD — Backend Mundial 2026
#
#  Flujo:
#    1) Lint + tsc build
#    2) Build imagen Docker → push a GHCR
#    3) SSH al Fedora → docker compose pull && up -d
#
#  Secrets necesarios:
#    SSH_HOST           app.esppapel.com
#    SSH_USER           deploy
#    SSH_PORT           22
#    SSH_PRIVATE_KEY    contenido completo de la clave privada ed25519
#    GHCR_USER          tu usuario de GitHub (LeizarM)
#    GHCR_TOKEN         PAT classic con scope write:packages
# ════════════════════════════════════════════════════════════════════════
name: Backend Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/polla-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            com.centurylinklabs.watchtower.enable=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copia los archivos de infra (compose, docker/, deploy/) al servidor.
      # El backend en sí corre desde la imagen GHCR, no necesita el código fuente.
      - name: Sync infra files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml,docker/,deploy/"
          target: "/opt/mundial2026"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/mundial2026
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            export BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/polla-backend:${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build --remove-orphans
            docker image prune -af --filter "until=168h" || true
            sleep 5
            curl -fsSk https://app.esppapel.com:9443/health || curl -fsS http://localhost:3000/health
            echo "✅ Deploy OK"
